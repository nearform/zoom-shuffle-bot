name: ci
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIRESTORE_COLLECTION: shuffle-bot-test
      FIRESTORE_EMULATOR_HOST: localhost:8081
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # firebase-tools 15 requires a JDK of at least 21 to run the Firestore
      # emulator used by the integration tests.
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: |
          npm ci
          npm run lint
          npm test
  automerge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
